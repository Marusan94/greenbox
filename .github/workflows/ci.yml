name: qa-screenplay
on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      - run: npx playwright test
        env:
          TERRAMIND_URL: https://terramind-mu.vercel.app
          PULSO_URL: https://marusan94.github.io/pulso-github/02-midnight-console.html
          QUERYLANDS_URL: https://tech-interview-bwx5ib0ib-maru-de07.vercel.app
          EDUCORE_URL: https://educore-frontend-co5c.onrender.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
