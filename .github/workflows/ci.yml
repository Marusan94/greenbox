name: greenroom-qa
on:
  push:
  workflow_dispatch:
  schedule:
    # Regresion nocturna (3:00 UTC) contra los deploys en vivo
    - cron: '0 3 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [terramind, pulso, querylands, educore]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install chromium --with-deps
      - run: npm run typecheck
      # Matriz: cada proyecto corre aislado; en push/manual va smoke, en cron va regresion
      - run: npx playwright test --project=${{ matrix.project }} --grep @smoke
        if: github.event_name != 'schedule'
        env:
          TERRAMIND_URL: https://terramind-mu.vercel.app
          PULSO_URL: https://marusan94.github.io/pulso-github/02-midnight-console.html
          QUERYLANDS_URL: https://tech-interview-bwx5ib0ib-maru-de07.vercel.app
          EDUCORE_URL: https://educore-frontend-co5c.onrender.com/
      - run: npx playwright test --project=${{ matrix.project }} --grep @regression
        if: github.event_name == 'schedule'
        env:
          TERRAMIND_URL: https://terramind-mu.vercel.app
          PULSO_URL: https://marusan94.github.io/pulso-github/02-midnight-console.html
          QUERYLANDS_URL: https://tech-interview-bwx5ib0ib-maru-de07.vercel.app
          EDUCORE_URL: https://educore-frontend-co5c.onrender.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
